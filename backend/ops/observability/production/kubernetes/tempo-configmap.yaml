apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  config.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
    compactor:
      compaction:
        block_retention: 336h
    storage:
      trace:
        backend: s3
        s3:
          bucket: tempo
          endpoint: minio:9000
          access_key: ${MINIO_ACCESS_KEY}
          secret_key: ${MINIO_SECRET_KEY}
          insecure: true
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
