apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
spec:
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: observability-workloads
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-01-17T23-25-50Z
          command: ["/bin/sh", "-c"]
          args:
            - >
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done &&
              mc mb --ignore-existing local/loki &&
              mc mb --ignore-existing local/tempo &&
              mc mb --ignore-existing local/observability-backups &&
              mc version enable local/loki &&
              mc version enable local/tempo &&
              mc version enable local/observability-backups &&
              mc anonymous set none local/loki &&
              mc anonymous set none local/tempo &&
              mc anonymous set none local/observability-backups &&
              mc ilm import local/loki < /config/loki-lifecycle.json &&
              mc ilm import local/tempo < /config/tempo-lifecycle.json &&
              mc ilm import local/observability-backups < /config/backups-lifecycle.json
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: observability-secrets
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: observability-secrets
                  key: minio-root-password
          volumeMounts:
            - name: lifecycle-config
              mountPath: /config
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: lifecycle-config
          configMap:
            name: minio-lifecycle-config
