catalog_id: scaffold_stage
catalog_version: "2026-04-21"
dialect: postgres
description: >
  Scaffold-stage analytics catalog for governed read-only agent queries over curated
  aggregate-friendly PostgreSQL curated views.
relations:
  - name: dashboard_data_entries
    description: Governed dashboard seed entries used by the MVP dashboard and analyst agent.
    columns:
      - name: entry_id
        data_type: text
        semantic_type: identifier
        sensitivity: public
        description: Stable dashboard entry name used as the product key.
      - name: dataset_key
        data_type: text
        semantic_type: dimension
        sensitivity: public
        description: Logical dataset grouping such as company overview or product profile.
      - name: sequence_no
        data_type: integer
        semantic_type: dimension
        sensitivity: public
        description: Ordered position from the governed CSV seed.
      - name: section_label
        data_type: text
        semantic_type: dimension
        sensitivity: public
        description: Human-readable dashboard section name.
      - name: prompt_text
        data_type: text
        semantic_type: text
        sensitivity: internal
        description: Question or prompt shown to operators.
      - name: answer_type
        data_type: text
        semantic_type: dimension
        sensitivity: public
        description: Expected answer type for the dashboard entry.
      - name: example_answer
        data_type: text
        semantic_type: text
        sensitivity: internal
        description: Example seeded answer for the dashboard entry.
  - name: analytics_daily_pipeline
    description: Daily aggregate pipeline metrics by lead source.
    columns:
      - name: metric_date
        data_type: date
        semantic_type: date
        sensitivity: public
        description: Calendar date for the aggregate bucket.
      - name: lead_source
        data_type: text
        semantic_type: dimension
        sensitivity: public
        description: Generic lead source classification.
      - name: leads_created
        data_type: integer
        semantic_type: metric
        sensitivity: public
        description: Number of leads created in the bucket.
      - name: meetings_booked
        data_type: integer
        semantic_type: metric
        sensitivity: public
        description: Number of meetings booked in the bucket.
      - name: pipeline_amount
        data_type: numeric
        semantic_type: currency
        sensitivity: internal
        description: Total pipeline amount associated with the bucket.
  - name: analytics_rep_performance
    description: Seller performance aggregates by reporting period.
    columns:
      - name: report_period
        data_type: text
        semantic_type: dimension
        sensitivity: public
        description: Reporting period identifier.
      - name: rep_name
        data_type: text
        semantic_type: dimension
        sensitivity: internal
        description: Human-readable seller identifier.
      - name: owner_email
        data_type: text
        semantic_type: pii
        sensitivity: restricted
        description: Seller email address.
      - name: meetings_completed
        data_type: integer
        semantic_type: metric
        sensitivity: public
        description: Count of completed meetings.
      - name: closed_won_amount
        data_type: numeric
        semantic_type: currency
        sensitivity: internal
        description: Closed-won revenue for the reporting bucket.
