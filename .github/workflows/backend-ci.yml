name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hello_sales
          POSTGRES_USER: hello_sales
          POSTGRES_PASSWORD: hello_sales
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hello_sales -d hello_sales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      HELLO_SALES_DATABASE_URL: postgresql+asyncpg://hello_sales:hello_sales@localhost:5432/hello_sales
      HELLO_SALES_RUN_POSTGRES_TESTS: "1"
      HELLO_SALES_POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://hello_sales:hello_sales@localhost:5432/hello_sales
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify database
        run: make verify-db

      - name: Apply migrations
        run: make migrate

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy src

      - name: Tests
        run: make test

      - name: Postgres tests
        run: make test-postgres
