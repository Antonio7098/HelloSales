services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hello_sales
      POSTGRES_USER: hello_sales
      POSTGRES_PASSWORD: hello_sales
    ports:
      - "5432:5432"
    volumes:
      - hello_sales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hello_sales -d hello_sales"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  loki:
    image: grafana/loki:3.4.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./backend/ops/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./backend/ops/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./backend/ops/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./backend/ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/ops/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./backend/ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ./backend/.env
    working_dir: /app/backend
    command: >
      /bin/bash -lc
      "PYTHONPATH=src alembic upgrade head &&
      PYTHONPATH=src uvicorn hello_sales_backend.app:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      HELLO_SALES_DATABASE_URL: postgresql+asyncpg://hello_sales:hello_sales@postgres:5432/hello_sales
      HELLO_SALES_CORS_ALLOWED_ORIGINS: '["http://localhost:5173", "http://localhost:5174"]'
      HELLO_SALES_AUTH_PROVIDER: dev
      HELLO_SALES_OBSERVABILITY_METRICS_ENABLED: "true"
      HELLO_SALES_OBSERVABILITY_METRICS_ENDPOINT_ENABLED: "true"
      HELLO_SALES_OBSERVABILITY_TRACING_ENABLED: "true"
      HELLO_SALES_OBSERVABILITY_TRACING_EXPORTER: otlp
      HELLO_SALES_OBSERVABILITY_TRACING_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ops:/app/ops:ro
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend-draft:
    build:
      context: .
      dockerfile: frontend-draft/Dockerfile.dev
    working_dir: /app/frontend-draft
    command: >
      /bin/sh -lc
      "npm install &&
      npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-draft:/app/frontend-draft
      - frontend_draft_node_modules:/app/frontend-draft/node_modules
    depends_on:
      - backend

volumes:
  frontend_draft_node_modules:

  grafana_data:
  hello_sales_postgres_data:
  loki_data:
  minio_data:
  prometheus_data:
  tempo_data:
